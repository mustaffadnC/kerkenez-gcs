name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.10.3 (MinGW) + toolchain
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: 'win64_mingw'
          modules: 'qtserialport qtcharts qtimageformats'
          tools: 'tools_mingw1310,qt.tools.win64_mingw1310'

      - name: Install Ninja
        run: pip install ninja

      - name: Configure
        shell: pwsh
        run: |
          $mingw = "$env:IQTA_TOOLS/mingw1310_64/bin"
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_C_COMPILER="$mingw/gcc.exe" `
            -DCMAKE_CXX_COMPILER="$mingw/g++.exe"

      - name: Build
        run: cmake --build build

      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "$env:QT_ROOT_DIR/bin;$env:IQTA_TOOLS/mingw1310_64/bin;$env:PATH"
          ctest --test-dir build --output-on-failure
